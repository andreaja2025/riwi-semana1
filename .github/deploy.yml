name: Deploy GitHub Pages

on:
  push:
    branches:
      - dia3 # Se ejecutará cada vez que subas cambios a esta rama

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # REEMPLAZA "TU_CARPETA" con el nombre exacto de tu carpeta (ej. "src", "public", "dia3", etc.)
          path: ./rueda-libre 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
